# =============================================================================
# Finding Mira — content/tokens/core.yaml
# The core fact-token table (design §9; schema v2 §2.1).
#
# CONVENTIONS
#   - Field order follows the §2.1 worked examples:
#     id, truth, tags, valence, summary, evidence?, wordings, minted_by,
#     decoy?, echo, editor.
#   - `truth:` is required on every token (schema principle 2). False tokens
#     (Aziza's canary, Mira's boathouse test, planted rumors, Dan's cover
#     story) spread like any other but never satisfy evidence gates.
#   - `valence:` entries are {subject, sign} pairs; subjects are the closed
#     set {dan, player, mira} (§10.1). 33 tokens here carry valence.
#   - `evidence:` cards live in content/tokens/evidence_cards.yaml. Every
#     `critical` token carries one (validator rule §2.9). The six critical
#     tokens: dan_photos_forged, mira_real_name, dacha_location,
#     informant_identity, restraining_order_record, dead_drop_channel.
#   - `minted_by: []` marks a dialogue-granted token: dialogue blocks declare
#     `mints:` and the validator unions block-side grants with token-side
#     sources when proving reachability (§2.1 field notes). The comment on
#     each names the intended granting channel for the dialogue author.
#   - `decoy:` appears ONLY on tokens whose minted_by contains a `deduction`
#     source (validator rule). The compiler derives `<id>__decoy` with
#     truth: false and contradicts: [<id>]. Five decoys here — enough for
#     the counter-bluff branch's decoy_count_at_least: 2 (§2.6).
#   - `echo: default` uses content/dialogue/dan/echo_templates.yaml; four
#     tokens override all three tiers where the template reads wrong.
#   - Mom's routine tokens are authored per slot-pattern class and selected
#     by the engine each morning (§2.1 field notes, design §13.1).
# =============================================================================


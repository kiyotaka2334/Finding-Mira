    source_chain: [timur, class_chat, "the Korzhik counter girl"]
    day: 3
    points_at: dan_is_scraping
    text: >-
      ok so the korzhik counter girl told dasha some city account was going
      through the bakery's old photos at like 3am. months ago. liking stuff
      from two years back. who does that. nobody normal does that

  - id: rumor_two_phones
    kind: distorted_truth
    source_chain: [mom, lyudmila]
    day: 4
    points_at: mira_had_second_phone
    text: >-
      Lyudmila Petrovna SWEARS the girl had two phones. One for show on the
      counter, and one that never once rang in the house…… her words, the
      dots are hers. Two phones! I can barely manage the one.

  - id: rumor_city_courts
    kind: distorted_truth
    source_chain: [mom, lyudmila]
    day: 5
    points_at: restraining_order_record
    text: >-
      SHE HAD TROUBLE IN THE CITY…… COURTS…… PAPERS…… — that is the entire
      statement, in capitals, and then Lyudmila looks pleased with herself
      and waters her geraniums.

  - id: rumor_dark_page
    kind: distorted_truth
    source_chain: [timur, class_chat]
    day: 5

  # ------------------------------------------------------------------
  # NOISE (11) — authored red herrings. Plausible, textured, going
  # nowhere. Several are searchable dead ends (see keywords.yaml).
  # ------------------------------------------------------------------

  - id: rumor_white_van
    kind: noise
    source_chain: [town_chat, oleg]
    day: 3
    text: >-
      Oleg keeps posting about a white van from the fish plant idling on
      Klenovaya "three nights running". The fish plant says it's their van.
      It is always their van. It has been their van since the van was new.

  - id: rumor_pe_teacher

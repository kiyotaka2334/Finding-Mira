  # ------------------------------------------------------------------
  # REACTIVE / DEFENSIVE (4) — keyed to network state. The town
  # investigating the player back, and stance-generated pushback when
  # disbelieved evidence circulates (§10.1, §17).
  # ------------------------------------------------------------------

  - id: rumor_player_police
    kind: defensive
    source_chain: [mom, galina]
    trigger:
      knowledge: {agent: town_chat, has: [player_asking_questions]}
    text: >-
      Galina asked me straight out at the bakery whether you're working for
      the city police. AT THE BAKERY. I said of course not, and she did the
      face. People are saying it, you know. All of them. At once.


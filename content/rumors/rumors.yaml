# =============================================================================
# Finding Mira — content/rumors/rumors.yaml
# The rumor feed (design §17): 1–3 rumors served each morning through Mom,
# Timur, or the chats. ~30 authored rumors.
#
# SCHEMA
#   id           unique rumor id
#   kind         distorted_truth | noise | defensive | memory_slip
#   source_chain ordered list, nearest first: who delivered it to the player,
#                then who they heard it from, back to the origin.
#                Renders as "Mom ← Lyudmila ← the bakery girl".
#                Canon agents (mom, lyudmila, galina, roza, timur, oleg,
#                town_chat, class_chat) are bare ids; flavor endpoints are
#                quoted strings.
#   text         spoken-register one-liner, voiced by source_chain[0]
#                (Mom relays in triple-message cadence; Timur lowercase;
#                Lyudmila ALL CAPS with ellipses……; Oleg quotes people).
#   day          fixed morning drop (game day), OR
#   trigger      typed condition per schema v2 §2.7 — reactive rumors fire the
#                first morning the condition holds (exactly one of day/trigger).
#   points_at    (distorted truths only) the real canonical token this rumor
#                gestures toward but does not mint. The lead, not the fact.
#
# Kind counts: 12 distorted_truth, 11 noise, 4 defensive/reactive, 3 memory_slip.
# =============================================================================

rumors:

  # ------------------------------------------------------------------
  # DISTORTED TRUTHS (12) — each points at a real token the player
  # hasn't found yet. The network is working FOR the player, badly.
  # ------------------------------------------------------------------

  - id: rumor_last_shutter
    kind: distorted_truth
    source_chain: [mom, roza]
    day: 1
    points_at: mira_last_seen_photo
    text: >-
      Roza says she was at the counter Thursday same as always, and Friday
      the shutter just never went up. No note, nothing. Thursday!! Write
      that down somewhere, you never write anything down.

  - id: rumor_bus_station_stranger
    kind: distorted_truth
    source_chain: [mom, galina, "the bakery girl"]
    day: 2
    points_at: dan_is_artyom
    text: >-
      Galina heard it from the bakery girl — back in spring there was a man
      at the bus station showing people a photo on his phone. Not from here.
      Nobody thought anything of it THEN, of course. Now everyone remembers
      him differently.

  - id: rumor_shore_path
    kind: distorted_truth
    source_chain: [town_chat, "the dog walkers"]
    day: 2
    points_at: routine_mapped
    text: >-
      The dog-walking crowd swears she did the shore path every morning
      before opening, rain or shine, same bench, same thermos. So who saw
      her Friday morning? Nobody. That's the whole town chat right now.

  - id: rumor_city_account_scraping

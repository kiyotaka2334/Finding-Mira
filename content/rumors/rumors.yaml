        - {knowledge: {agent: town_chat, has: [dan_photos_forged]}}
        - {stance: {agent: town_chat, subject: dan, at_least: 1}}
    text: >-
      Roza's line all morning: "people will say anything about a boy who
      cries at a vigil." That shadows business is going around and it is
      going around BADLY — the whole street has decided it's spite.

  - id: rumor_eight_months_defense

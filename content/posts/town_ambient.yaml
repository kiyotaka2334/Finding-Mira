  # --- NOISE: gardens, dogs, weather ----------------------------------------------

  - id: ta_vera_dahlias
    network: prostor
    author: "@vera_dachnitsa"
    date: {day: -15, display: "Sep 29 (Y0)"}
    time: "15:20"
    photo: {ref: photo_vera_dahlias, hotspots: []}
    text: "Dug the dahlias before the frost, UNLIKE SOME on my lane who will be posting sad photos in November asking 'what happened.' The frost happened. It happens every year. It is famous for happening."

  - id: ta_vera_beryozka_note
    network: prostor
    author: "@vera_dachnitsa"
    date: {day: 7, display: "Oct 20 (Y0)"}
    time: "16:05"
    text: "To the Beryozka board: the lane lamp by plots 30–40 has been out since AUGUST. Some of us check our plots in the dark season. Fix the lamp before someone breaks a leg and writes a longer post."
    editor: "Noise that becomes signal only in hindsight: 'some of us check our
      plots in the dark season' — the co-op isn't as empty in winter as the
      town assumes. Supports the dacha deduction without pointing at it."

  - id: ta_dogs_sema_election
    network: prostor
    author: "@pavlik_and_sema"
    date: {day: -1, display: "Oct 13 (Y0)"}
    time: "19:12"

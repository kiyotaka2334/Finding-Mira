    text: "Sema has been elected Mayor of the Square by a landslide (the landslide was me, dropping the sausages). His first decree: all sausages. His second decree: see first decree."

  - id: ta_dogs_pavlik_boots
    network: prostor
    author: "@pavlik_and_sema"
    date: {day: 6, display: "Oct 19 (Y0)"}
    time: "08:50"
    photo: {ref: photo_pavlik_boots, hotspots: []}
    text: "Pavlik (the small one, yes we know, long story with the names) has refused the winter boots for the third year. We respect his journey. We do not respect the vet bill."

  - id: ta_weather_frost
    network: prostor
    author: "@ozerny_weather_amateur"
    date: {day: -4, display: "Oct 10 (Y0)"}
    time: "06:00"
    text: "Pressure falling since Thursday. First hard frost tonight or tomorrow, −3 to −5 by the water. Cover what you love. The barometer has been right 41 years and is not starting to lie now."
    editor: "Dated day -4: the frost arrives the night Mira goes to ground.
      Later, players notice the dacha needed the propane exactly then."

  - id: ta_weather_ice
    network: prostor
    author: "@ozerny_weather_amateur"
    date: {day: 9, display: "Oct 22 (Y0)"}
    time: "06:00"
    text: "Skim ice on the shallows this morning. Not walking ice. It will not be walking ice for six weeks minimum and the lake does not care how brave your children are. Six weeks."

  # --- NOISE: assorted townsfolk ----------------------------------------------------

  - id: ta_lost_cat
    network: prostor
    author: "@sveta_ozerny88"
    date: {day: -7, display: "Oct 7 (Y0)"}
    time: "20:33"
    text: "MARQUIS IS MISSING AGAIN. Gray, enormous, no manners, answers to nothing. If he's in your shed he is NOT lost, he is freeloading, please just push him out at dusk and he'll come home. Do not feed him. He tells us we don't feed him. Look at him. Lies."

  - id: ta_found_cat
    network: prostor
    author: "@sveta_ozerny88"
    date: {day: -6, display: "Oct 8 (Y0)"}
    time: "09:14"
    text: "Marquis has returned. He smells of smoked fish. Nobody in this house smokes fish. We have questions but no jurisdiction. Thank you all."


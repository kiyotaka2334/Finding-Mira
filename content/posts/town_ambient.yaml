# Finding Mira — Ozerny ambient noise pool (design §23: ~120 micro-items at
# full scope; this file is the first authored tranche, ~45)
# ---------------------------------------------------------------------------
# Post schema: identical to mira_curated.yaml. Most items are pure noise —
# the signal-to-noise bed the investigation sits in. Signal-bearing items are
# marked with `mints:` or editor notes. 10 distinct recurring minor voices:
#   @korzhik.ozerny      — the bakery. Relentless enthusiasm, comic-sans soul.
#   @school2_ozerny      — school №2 official. Bureaucratic cheer.
#   @dk_ozerny           — House of Culture. Event spam, dignified.
#   @oleg_fisher_41      — Oleg. Grievance + fish.
#   @marat_taxi          — the town's one taxi. Terse. Availability updates.
#   @kolyan_bar          — the bar. Menu photos taken in the dark.
#   @vera_dachnitsa      — retiree, garden militant, dahlia wars.
#   @pavlik_and_sema     — man documenting his two dogs. Beloved.
#   @galina_pirogi       — Galina (Mom's Galina). Baking + intel adjacency.
#   @ozerny_weather_amateur — retired teacher with a barometer. Solemn.
# ---------------------------------------------------------------------------

posts:
  # --- SIGNAL ---------------------------------------------------------------

  - id: ta_korzhik_promo
    network: prostor
    author: "@korzhik.ozerny"
    date: {day: -21, display: "Sep 23 (Y0)"}
    time: "17:48"
    photo: {ref: card_bakery_promo, hotspots: [window_reflection, square_clock]}
    mints_on_hotspot: [korzhik_reflection]
    text: "NEW WINDOW DISPLAY for our anniversary month!!! 🥐🎉 Come see (and yes the honey cake is BACK by popular demand, Lyudmila Petrovna, we heard you 😄)"
    editor: "THE photo (design 8.4 + §4). Hotspot window_reflection: a woman in
      the glass, market bag, caught mid-step — Mira, identifiable by coat and
      posture, never by face. Hotspot square_clock fixes the time at 07:40 —
      her morning route. The player geolocates her from it in Act 1; the promo's
      public tag is how Artyom found the town. Same photo, both directions."

  - id: ta_search_party_forms
    network: prostor
    author: "@dk_ozerny"
    date: {day: 5, display: "Oct 18 (Y0)"}
    time: "10:02"
    mints: [search_party_forming]
    text: "NOTICE: A volunteer coordination meeting regarding the search for M. Sokolova will be held at the House of Culture, Saturday 12:00. Coordination chat link in comments. All welcome. Dress for the weather."
    editor: "Opens search_party_chat (8.6). Dan reads the open chat same-tick."

  - id: ta_bus_timetable
    network: prostor
    author: "@ozerny_admin_page"
    date: {day: -40, display: "Sep 4 (Y0)"}
    time: "09:00"
    text: "Reminder: from September 1 the intercity bus runs the WINTER schedule. Vetrogorsk direction: 06:50 and 14:10 daily. Northbound (Priozersk): 08:30 Tue/Thu/Sat only. Please plan accordingly."
    editor: "Reference doc for several checks: the decoy 'northbound bus on the
      4th' (dacha_location__decoy) is checkable against Tue/Thu/Sat; the
      stranger_at_bus_station rumor gets its timetable context here."

  - id: ta_marat_stranger
    network: prostor
    author: "@marat_taxi"
    date: {day: 3, display: "Oct 16 (Y0)"}
    time: "21:15"
    text: "To whoever keeps calling from the hidden number asking about fares 'out past the dachas' — I don't quote prices to hidden numbers. Call like a person."
    editor: "Signal dressed as grumbling: Artyom probing the dacha direction by
      phone before coming in person (artyom_scouted_town corroboration)."


    editor: "Rufat's register even in the official account. Also quietly confirms
      the pharmacy is down one pharmacist and hasn't shortened hours: he's
      covering her shifts himself, saying nothing (his §7 'quiet worry' texture)."

  - id: ta_house_of_culture_repair
    network: prostor
    author: "@ozerny_admin_page"
    date: {day: -30, display: "Sep 14 (Y0)"}
    time: "10:00"
    text: "The House of Culture roof repair is COMPLETE, two weeks ahead of schedule. The administration thanks residents for their patience and asks them to stop testing the acoustics of the new hall by shouting 'echo.' It does not echo. That was the point of the repair."

  - id: ta_mushroom_report
    network: prostor
    author: "@grib_ozerny_petrovich"
    date: {day: -16, display: "Sep 28 (Y0)"}
    time: "17:25"
    text: "Season report, final: the birch side of the lake gave nothing all September. The pine side gave EVERYTHING. I have said too much. Petrovich out."

  - id: ta_knitting_circle
    network: prostor
    author: "@roza_ozerny_choir"

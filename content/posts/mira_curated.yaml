# Finding Mira — @mira.ozerny curated feed (Prostor)
# ---------------------------------------------------------------------------
# Post schema (minimal, defined for this content set; see schema-v2 §2.1 for
# tokens/cards — posts reference them, they don't define them):
#   id:       unique post id (snake_case)
#   network:  prostor | svoi
#   author:   "@handle"
#   date:     {day: <int>, display: "Mon D (Y-n)"}
#             day = offset from game day 1 (negative = before). No day 0:
#             day -1 is the day before day 1. Day 1 = Wednesday, Oct 14, Y0.
#             display year marker: (Y0) = game year, (Y-1) = a year earlier, etc.
#   time:     "HH:MM" posting time (part of the pattern forensics)
#   text:     post body, verbatim as shown in game
#   photo:    {ref: <card/photo id>, hotspots: [<hotspot ids>]}   (optional, §19)
#   tags:     content tags (optional)
#   mints:    [token ids] minted on discovery/inspection (optional)
#   comments: [{author, text}] (optional)
#   editor:   authoring notes, never shown in game (optional)
# ---------------------------------------------------------------------------
# VOICE: Mira Sokolova, the performance. Proper capitalization, tidy sentences,
# dry wit rationed to about one joke per post, almost no emoji. Deliberately
# pleasant, deliberately boring — but human. Posts almost exclusively between
# 06:45 and 08:15 (morning person; her one honest habit).
#
# THE TELLS (for re-readers; never called out in text):
#   1. Her face is never straight-on: photos are hands, back, objects, scarf.
#   2. She never posts a place the same day she's there — everything is
#      "yesterday's market", "last night's sunset", "late post from Sunday".
#   3. There are no photos of her street (Klenovaya) or her building. Ever.
#   4. The register is *flatter* than Katya's old posts (katya_archive.yaml)
#      and *warmer* than @k_moroz (mira_real.yaml). Same person, sanded down.
#
# MIRRORS: every date shared with mira_real.yaml uses the identical day offset.
# ---------------------------------------------------------------------------

profile:
